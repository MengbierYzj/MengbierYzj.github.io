<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://api.github.com; img-src 'self' https: http: data:; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>Edit Academic Homepage</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../style.css?v=4">
  <script type="module" src="editor.js?v=5"></script>
</head>
<body>
  <div class="site-frame">
    <header class="site-header">
      <div class="masthead">
        <a class="brand" href="../">Academic Homepage</a>
      </div>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="../">Back to Home</a><a href="./" aria-current="page">Edit Homepage</a>
      </nav>
    </header>
    <main class="editor">
      <div class="editor-heading">
        <h1>Edit Academic Homepage</h1>
        <p>Edit your profile, preview a draft, or publish it to GitHub Pages.</p>
      </div>
      <form id="editor" autocomplete="off">
        <fieldset id="editor-fields" disabled>
          <section class="panel" aria-labelledby="news-heading">
            <div class="panel-head"><h2 id="news-heading">News</h2><button type="button" data-add="news">Add News Item</button></div>
            <div id="news"></div>
          </section>
          <section class="panel" aria-labelledby="activities-heading">
            <div class="panel-head"><h2 id="activities-heading">Talks / Teaching / Service</h2><button type="button" data-add="activities">Add Entry</button></div>
            <div id="activities"></div>
          </section>
          <section class="panel" aria-labelledby="profile-heading">
            <h2 id="profile-heading">Profile</h2>
            <div id="profile-fields" class="fields">
              <div class="avatar-tools wide">
                <img id="avatar-preview" alt="Profile photo preview" width="64" height="64" hidden>
                <label class="field">Upload profile photo<input type="file" id="avatar-file" accept="image/jpeg,image/png,image/webp"></label>
                <button type="button" id="clear-avatar" hidden>Remove uploaded photo</button>
              </div>
            </div>
          </section>
          <section class="panel" aria-labelledby="education-heading">
            <div class="panel-head"><h2 id="education-heading">Education</h2><button type="button" data-add="education">Add Education Entry</button></div>
            <div id="education"></div>
          </section>
          <section class="panel" aria-labelledby="publications-heading">
            <div class="panel-head"><h2 id="publications-heading">Publications</h2><button type="button" data-add="publications">Add Publication</button></div>
            <div id="publications"></div>
          </section>
        </fieldset>
        <section class="panel" aria-labelledby="publish-heading">
          <h2 id="publish-heading">Save and Publish</h2>
          <label class="field" for="token">
            GitHub Access Token
            <input type="password" id="token" placeholder="Required to publish" autocomplete="off" spellcheck="false">
            <small>Use a fine-grained token scoped to this repository with read and write access to Contents. The token is used only for the current publish request. <a href="https://github.com/settings/personal-access-tokens/new?name=Academic%20Homepage&amp;target_name=MengbierYzj&amp;contents=write" target="_blank" rel="noopener noreferrer">Create a token</a></small>
          </label>
          <div class="actions">
            <button type="button" id="preview" disabled>Save and Preview Draft</button>
            <button type="submit" class="primary" id="publish" disabled>Publish to GitHub</button>
            <button type="button" id="reload" disabled>Load Latest from GitHub</button>
          </div>
          <p id="status" role="status" aria-live="polite">Loading profile…</p>
        </section>
      </form>
    </main>
  </div>
</body>
</html>
